[package]
name = "mmm-core"
description = "Mega Merge Mosaic core library — astrophotography mosaic merge/blend engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
memmap2.workspace = true
bytemuck.workspace = true
png.workspace = true
rayon.workspace = true
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["mman", "fs"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    # Required: CreateFileMappingW's signature references SECURITY_ATTRIBUTES
    # (Win32_Security); without this feature shm.rs fails to compile (E0432,
    # "no CreateFileMappingW in Win32::System::Memory"). Verified empirically
    # via `cargo check --target x86_64-pc-windows-gnu`.
    "Win32_Security",
    "Win32_System_Memory",
] }

[features]
# Exposes `ipc::testhost` (the reference in-process host used by mmm-core's
# own unit tests) to other crates, so a cross-process integration test can
# drive the real host-serving loop against a real worker binary without
# duplicating it. See `ipc::mod` for the cfg this gates.
testkit = []
