# Builds the PixInsight module (mmm-pxm) + mmm-ipc-worker against the pinned
# open-source PCL (2.10.8 / PixInsight 1.9.5, one pin for every target), with
# NO PixInsight on the runner. All four targets -- Linux (x64), macOS (arm64 +
# x64), and Windows (x64) -- are live, required build+test jobs. macOS ships
# both arches: arm64 for Apple Silicon, x64 for Intel Macs.
name: Module

on:
  # The staged mmm-ipc-worker embeds all of mmm-core, so any core or
  # dependency change alters what the module ships — not just the ipc crates.
  push:
    paths:
      - "integration/pixinsight/**"
      - "crates/mmm-core/**"
      - "crates/mmm-ipc-worker/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/module.yml"
  pull_request:
    paths:
      - "integration/pixinsight/**"
      - "crates/mmm-core/**"
      - "crates/mmm-ipc-worker/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/module.yml"
  workflow_dispatch:

concurrency:
  group: module-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: build+test (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Read PCL pin
        id: pcl
        run: |
          . integration/pixinsight/ci/pcl-pin.env
          echo "sha=$PCL_SHA" >> "$GITHUB_OUTPUT"

      - name: Cache libPCL-pxi.a (keyed on PCL commit)
        id: pcl-cache
        uses: actions/cache/restore@v4
        with:
          path: pcl-ci
          key: pcl-${{ runner.os }}-${{ steps.pcl.outputs.sha }}

      - name: Build PCL (on cache miss)
        if: steps.pcl-cache.outputs.cache-hit != 'true'
        run: bash integration/pixinsight/ci/build-pcl.sh --out "$PWD/pcl-ci"

      - name: Save libPCL-pxi.a cache (only after a successful build)
        if: steps.pcl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: pcl-ci
          key: pcl-${{ runner.os }}-${{ steps.pcl.outputs.sha }}

      - name: Build module + worker, stage payload
        run: |
          bash integration/pixinsight/ci/build-module-linux.sh \
            --pcl "$PWD/pcl-ci" --stage "$PWD/stage"

      - name: Rust tests (ipc crates; ci.yml owns full workspace on main)
        run: cargo test -p mmm-core -p mmm-ipc-worker

      - name: Host golden CTest suite (no PixInsight)
        run: |
          cmake -S integration/pixinsight/host -B integration/pixinsight/host/ci-build
          cmake --build integration/pixinsight/host/ci-build
          ctest --test-dir integration/pixinsight/host/ci-build --output-on-failure

      - name: Write bundle provenance
        shell: bash
        run: printf 'sha=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > bundle-info.txt

      # bundle-info.txt is a second upload root on purpose: upload-artifact
      # stores files relative to the least common ancestor of the matched
      # paths, so a lone stage/bin/** root would flatten the payload to the
      # artifact root. The extra root pins the ancestor at the workspace root,
      # preserving stage/bin/... — the bundle-contract layout the consumer
      # (Astrometrical website repo) expects.
      - name: Upload unsigned module artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mmm-pxm-linux-x64
          path: |
            stage/bin/**
            stage/doc/**
            bundle-info.txt
          if-no-files-found: error

  windows:
    name: build+test (windows-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust (msvc)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Read PCL pin
        id: pcl
        shell: bash
        run: |
          . integration/pixinsight/ci/pcl-pin.env
          echo "sha=$PCL_SHA" >> "$GITHUB_OUTPUT"

      - name: Cache PCL-pxi.lib (keyed on PCL commit)
        id: pcl-cache
        uses: actions/cache/restore@v4
        with:
          path: pcl-ci
          key: pcl-${{ runner.os }}-${{ steps.pcl.outputs.sha }}-${{ hashFiles('integration/pixinsight/ci/build-pcl-windows.ps1', 'integration/pixinsight/ci/win/PCL.vcxproj') }}

      - name: Build PCL (on cache miss)
        if: steps.pcl-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: integration/pixinsight/ci/build-pcl-windows.ps1 -Out "$PWD/pcl-ci"

      - name: Save PCL-pxi.lib cache (only after a successful build)
        if: steps.pcl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: pcl-ci
          key: pcl-${{ runner.os }}-${{ steps.pcl.outputs.sha }}-${{ hashFiles('integration/pixinsight/ci/build-pcl-windows.ps1', 'integration/pixinsight/ci/win/PCL.vcxproj') }}

      - name: Confirm PCL archive
        shell: pwsh
        run: |
          if (-not (Test-Path "$PWD/pcl-ci/lib/PCL-pxi.lib")) { exit 1 }
          if (-not (Test-Path "$PWD/pcl-ci/lib/lcms-pxi.lib")) { exit 1 }

      - name: Rust tests (ipc crates)
        run: cargo test -p mmm-core -p mmm-ipc-worker

      - name: Host golden CTest suite (no PixInsight)
        shell: bash
        run: |
          cmake -S integration/pixinsight/host -B integration/pixinsight/host/ci-build
          cmake --build integration/pixinsight/host/ci-build --config Release
          ctest --test-dir integration/pixinsight/host/ci-build --build-config Release --output-on-failure

      - name: Build module + worker, stage payload
        shell: pwsh
        run: integration/pixinsight/ci/build-module-windows.ps1 -Pcl "$PWD/pcl-ci" -Stage "$PWD/stage"

      - name: Write bundle provenance
        shell: bash
        run: printf 'sha=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > bundle-info.txt

      # Second upload root pins the least-common-ancestor at the workspace
      # root so stage/bin/... survives in the artifact (see the linux job).
      - name: Upload unsigned module artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mmm-pxm-windows-x64
          path: |
            stage/bin/**
            stage/doc/**
            bundle-info.txt
          if-no-files-found: error

  macos:
    name: build+test (macos-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64: Apple Silicon cores.
          - arch: arm64
            runner: macos-latest
          # x64: Intel Macs. Native Intel runner (macos-13 was retired) so
          # tests run natively too.
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Read PCL pin
        id: pcl
        run: |
          . integration/pixinsight/ci/pcl-pin.env
          echo "sha=$PCL_SHA" >> "$GITHUB_OUTPUT"

      - name: Cache libPCL-pxi.a (keyed on PCL commit)
        id: pcl-cache
        uses: actions/cache/restore@v4
        with:
          path: pcl-ci
          key: pcl-${{ runner.os }}-${{ matrix.arch }}-${{ steps.pcl.outputs.sha }}-${{ hashFiles('integration/pixinsight/ci/build-pcl-macos.sh') }}

      - name: Build PCL (on cache miss)
        if: steps.pcl-cache.outputs.cache-hit != 'true'
        run: bash integration/pixinsight/ci/build-pcl-macos.sh --out "$PWD/pcl-ci" --arch ${{ matrix.arch }}

      - name: Save libPCL-pxi.a cache (only after a successful build)
        if: steps.pcl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: pcl-ci
          key: pcl-${{ runner.os }}-${{ matrix.arch }}-${{ steps.pcl.outputs.sha }}-${{ hashFiles('integration/pixinsight/ci/build-pcl-macos.sh') }}

      - name: Confirm PCL archive
        run: test -f "$PWD/pcl-ci/lib/libPCL-pxi.a"

      - name: Build module + worker, stage payload
        run: |
          bash integration/pixinsight/ci/build-module-macos.sh \
            --pcl "$PWD/pcl-ci" --stage "$PWD/stage" --arch ${{ matrix.arch }}

      - name: Rust tests (ipc crates)
        run: cargo test -p mmm-core -p mmm-ipc-worker

      - name: Host golden CTest suite (no PixInsight)
        run: |
          cmake -S integration/pixinsight/host -B integration/pixinsight/host/ci-build
          cmake --build integration/pixinsight/host/ci-build
          ctest --test-dir integration/pixinsight/host/ci-build --output-on-failure

      - name: Write bundle provenance
        shell: bash
        run: printf 'sha=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > bundle-info.txt

      # Second upload root pins the least-common-ancestor at the workspace
      # root so stage/bin/... survives in the artifact (see the linux job).
      - name: Upload unsigned module artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mmm-pxm-macos-${{ matrix.arch }}
          path: |
            stage/bin/**
            stage/doc/**
            bundle-info.txt
          if-no-files-found: error
