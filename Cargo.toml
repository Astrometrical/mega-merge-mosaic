[workspace]
resolver = "3"
members = ["crates/mmm-core", "crates/mmm", "crates/mmm-ipc-worker"]

[workspace.package]
# Kept in exact sync with the PixInsight module's MMM_VERSION_STRING
# (integration/pixinsight/module/MmmVersion.h) and the host library's
# kExpectedWorkerVersion (integration/pixinsight/host/mmm_protocol.h): the
# module refuses a worker whose CARGO_PKG_VERSION differs (version
# handshake, PROTOCOL.md §10). The sync is enforced by
# crates/mmm-ipc-worker/tests/version_sync.rs.
version = "1.3.1"
edition = "2024"
license = "Apache-2.0"
authors = ["Astrometrical <https://github.com/Astrometrical>"]
repository = "https://github.com/Astrometrical/mega-merge-mosaic"

[workspace.dependencies]
mmm-core = { path = "crates/mmm-core" }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
bytemuck = "1"
png = "0.17"
rayon = "1.10"
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Blend math is hot-path; always optimize dependencies even in dev builds
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
