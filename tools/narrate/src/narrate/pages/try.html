<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>narrate try</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6a66; --border: #dddbd5;
    --accent: #2f6f8f; --accent-soft: #e3eef3; --on-accent: #ffffff; --ok: #2e7d4f; --bad: #b3402e; --warn: #8a6d1f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121417; --surface: #1b1e22; --text: #e8e6e1; --muted: #9a9892; --border: #2c3036;
      --accent: #7fb6d2; --accent-soft: #1f2d35; --on-accent: #10161a; --ok: #6cc08f; --bad: #e08070; --warn: #d8b65a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .intro { color: var(--muted); margin: 0 0 16px; }
  button { font: inherit; color: var(--text); padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #status { min-height: 1.5em; margin: 0 0 12px; color: var(--muted); }
  #status.error { color: var(--bad); font-weight: 600; }
  #status.saved { color: var(--ok); font-weight: 600; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .card.chosen { border-color: var(--ok); }
  .head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .label { font-weight: 700; font-size: 18px; min-width: 1.5em; }
  .spelling { font-family: ui-monospace, Consolas, monospace; color: var(--muted); }
  .clip { margin: 6px 0; }
  .clip .meta { font-size: 13px; color: var(--muted); }
  .clip .flags { font-size: 13px; color: var(--bad); font-weight: 600; }
  audio { width: 100%; height: 36px; }
  .actions { margin-top: 10px; }
  .none { margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>narrate try</h1>
  <p class="intro" id="intro">Loading…</p>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="candidates"></div>
  <div class="none"><button type="button" id="none">None of these</button></div>
</main>
<script>
"use strict";
const API = { state: "/api/state", pick: "/api/pick" };
let state = null;

const $ = (id) => document.getElementById(id);

function el(tag, props, children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "text") node.textContent = v;
    else if (k === "class") node.className = v;
    else node.setAttribute(k, v);
  }
  for (const c of children || []) node.appendChild(c);
  return node;
}

function setStatus(text, kind) {
  const s = $("status");
  s.textContent = text;
  s.className = kind || "";
}

async function request(url, body) {
  const init = body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  };
  let res;
  try {
    res = await fetch(url, init);
  } catch (e) {
    throw new Error("could not reach the server");
  }
  let data = null;
  try { data = await res.json(); } catch (e) { /* non-JSON error body */ }
  if (!res.ok) throw new Error((data && data.error) || "request failed (" + res.status + ")");
  return data;
}

function renderCandidate(cand) {
  const chosen = state.picked === cand.label;
  const head = el("div", { class: "head" }, [el("span", { class: "label", text: cand.label })]);
  if (cand.spelling !== undefined) head.appendChild(el("span", { class: "spelling", text: cand.spelling }));
  const card = el("section", { class: "card" + (chosen ? " chosen" : ""), "aria-label": "Candidate " + cand.label }, [head]);
  for (const clip of cand.clips) {
    const audio = el("audio", {
      controls: "", preload: "none",
      "aria-label": "Candidate " + cand.label + ", sentence " + (clip.carrier_index + 1),
      src: "/clips/" + encodeURIComponent(clip.id) + ".wav",
    });
    const box = el("div", { class: "clip" }, [el("div", { class: "meta", text: "Sentence " + (clip.carrier_index + 1) }), audio]);
    if (clip.flags && clip.flags.length) box.appendChild(el("div", { class: "flags", text: "Flags: " + clip.flags.join(", ") }));
    card.appendChild(box);
  }
  const btn = el("button", { type: "button", class: "primary", text: chosen ? "Closest (picked)" : "Closest" });
  btn.addEventListener("click", () => pick(cand.label));
  card.appendChild(el("div", { class: "actions" }, [btn]));
  return card;
}

function render() {
  $("intro").textContent = "Listen to each candidate in every sentence and pick the one closest to how “"
    + state.word + "” should sound. The spellings are hidden until you pick. Writes to " + state.list + ".";
  $("candidates").replaceChildren(...state.candidates.map(renderCandidate));
  $("none").classList.toggle("chosen", state.picked === "none");
}

async function pick(choice) {
  try {
    state = await request(API.pick, { choice: choice });
  } catch (e) {
    setStatus(e.message, "error");
    return;
  }
  render();
  if (choice === "none") setStatus("Nothing changed.", "saved");
  else setStatus("Saved: " + state.spelling, "saved");
}

$("none").addEventListener("click", () => pick("none"));

(async () => {
  try {
    state = await request(API.state);
    render();
  } catch (e) {
    setStatus(e.message, "error");
  }
})();
</script>
</body>
</html>
